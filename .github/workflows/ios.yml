name: iOS
run-name: LifeOS Folio · iOS · ${{ github.sha }}
# No one working on Folio has a Mac: this machine builds the iPhone and
# iPad app and sends it to App Store Connect, where TestFlight gives it to
# the lawyers who test it. Signing is automatic: the App Store Connect key
# lets Xcode make the distribution certificate and the profile it needs.
# Secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8
# file, base64).
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: folio-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Gizli bilgiler var mı
        run: |
          for name in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::$name eksik: depo ayarlarında gizli bilgi olarak eklenmeli."
              exit 1
            fi
          done
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: App Store Connect anahtarı
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Flutter'ı hazırla
        # Each upload needs a build number of its own: this run's.
        run: flutter build ios --release --no-codesign --build-number "$GITHUB_RUN_NUMBER"
      - name: Arşivle
        # Archived unsigned: signing an archive asks for a development
        # profile, which needs a registered iPhone. The export below signs it
        # for the App Store, a profile that needs no device. Folio has no
        # entitlements of its own, so nothing is lost in between.
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
      - name: App Store Connect'e yükle
        # "upload": the export sends the build to App Store Connect itself;
        # TestFlight shows it once Apple has processed it.
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Anahtarı sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
