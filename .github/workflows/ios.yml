name: iOS
run-name: LifeOS Folio · iOS · ${{ github.sha }}
# No one working on Folio has a Mac: this machine builds the iPhone and
# iPad app and sends it to App Store Connect, where TestFlight gives it to
# the lawyers who test it. Runner's Release is signed by hand with Apple
# Distribution and the App Store profile "Folio App Store CI".
# Secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8
# file, base64), IOS_DIST_P12 (base64), IOS_DIST_P12_PASSWORD,
# IOS_APPSTORE_PROFILE (the .mobileprovision, base64).
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: folio-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Gizli bilgiler var mı
        run: |
          for name in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::$name eksik: depo ayarlarında gizli bilgi olarak eklenmeli."
              exit 1
            fi
          done
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Masaüstüne ait dosyaları çıkar
        # The Windows and Linux context-menu scripts are Folio's assets on
        # the desktop; in the iPhone app Apple takes a script for code left
        # unsigned and turns the build away. This run's copy only.
        run: |
          sed -i '' -e '/packaging\/windows\/register-viewer.ps1/d' \
            -e '/packaging\/linux\/context_menu.py/d' pubspec.yaml
          ! grep -q 'packaging/linux/context_menu.py' pubspec.yaml
      - run: flutter pub get
      - name: App Store Connect anahtarı
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Flutter'ı hazırla
        # Each upload needs a build number of its own: this run's.
        run: flutter build ios --release --no-codesign --build-number "$GITHUB_RUN_NUMBER"
      - name: Dağıtım sertifikası ve profili
        # Apple Distribution and the App Store profile "Folio App Store CI",
        # made once through the App Store Connect API (kept in
        # ~/folio-imza-yedek/apple/ios-dagitim): Runner's Release signs with
        # them by hand, no device needed.
        env:
          P12: ${{ secrets.IOS_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/folio.keychain-db"
          # Known to the clean-up at once, though a step below fails.
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/folio.mobileprovision"
          uuid="$(security cms -D -i "$RUNNER_TEMP/folio.mobileprovision" | plutil -extract UUID raw -)"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/folio.mobileprovision" "$dir/$uuid.mobileprovision"
          done
      - name: Arşivle
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            archive
      - name: App Store Connect'e yükle
        # "upload": the export sends the build to App Store Connect itself;
        # TestFlight shows it once Apple has processed it.
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.lifeos.folio</key><string>Folio App Store CI</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Anahtarı sil
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/folio.mobileprovision"
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
