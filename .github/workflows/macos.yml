name: macOS
run-name: LifeOS Folio · macOS · ${{ github.sha }}
# No one working on Folio has a Mac, so this machine is where the Mac build is
# made and tried: the suite, the app built, and the package a tester installs.
# With the Developer ID certificate and the App Store Connect key in the
# repository's secrets, the package is signed by Apple's Developer ID and
# notarized, and opens like any app; without them it is signed ad hoc and
# opens after the tester allows it once in System Settings → Privacy &
# Security.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Paketi deneme sürümü olarak yayımla
        type: boolean
        default: false
  # A release (release.yml): the package goes into that release, under one
  # name for every version, which the site's Mac link downloads.
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
permissions:
  # Publishing the test package as a prerelease; nothing is pushed.
  contents: write
concurrency:
  group: folio-macos-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Testler
        # Measured, not yet required: what fails here is the Mac work left.
        continue-on-error: true
        run: flutter test -r failures-only
      - name: macOS uygulamasını derle
        run: flutter build macos --release
      - name: e-Devlet penceresini derle
        # The Mac counterpart of linux/edevlet, for both kinds of Mac.
        run: |
          for arch in arm64 x86_64; do
            swiftc -O -target "$arch-apple-macos12.0" macos/edevlet/folio_edevlet.swift \
              -o "$RUNNER_TEMP/folio-edevlet-$arch"
          done
          lipo -create "$RUNNER_TEMP"/folio-edevlet-arm64 "$RUNNER_TEMP"/folio-edevlet-x86_64 \
            -output "$RUNNER_TEMP/folio-edevlet"
      - name: İmza sertifikasını yükle
        # Into a keychain of this run alone, gone with the machine.
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::notice::Developer ID sertifikası yok: paket yerel imzayla yapılacak."
            exit 0
          fi
          keychain="$RUNNER_TEMP/folio.keychain-db"
          pass="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/id.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/id.p12"
          # By its fingerprint: the name has an Ö in it.
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -nE 's/^ *[0-9]+\) ([0-9A-F]{40}) "Developer ID Application:.*/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::Sertifikada Developer ID Application kimliği bulunamadı."
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Paketle
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/p' pubspec.yaml)"
          app="build/macos/Build/Products/Release/LifeOS Folio.app"
          cp "$RUNNER_TEMP/folio-edevlet" "$app/Contents/MacOS/folio-edevlet"
          if [ -d native_tools/macos-universal ]; then
            python3 packaging/native/verify.py macos-universal
            mkdir -p "$app/Contents/Resources/tools"
            cp -R native_tools/macos-universal/bin native_tools/macos-universal/tessdata \
              "$app/Contents/Resources/tools/"
          else
            echo "::warning::native_tools/macos-universal yok: OCR ve PDF küçültme bu pakette çalışmaz."
          fi
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            # Developer ID, inside out, with the hardened runtime and a
            # timestamp, as notarization asks: every library and program in
            # the bundle, the frameworks, the app with its entitlements.
            sign() { codesign --force --options runtime --timestamp --sign "$SIGN_IDENTITY" "$@"; }
            find "$app/Contents" -type f \( -name '*.dylib' -o -perm -u+x \) \
              ! -path '*/MacOS/LifeOS Folio' 2>/dev/null \
              | while read -r f; do
                  if file "$f" | grep -q 'Mach-O'; then sign "$f"; fi
                done
            find "$app/Contents/Frameworks" -maxdepth 1 -name '*.framework' 2>/dev/null \
              | while read -r f; do sign "$f"; done
            sign --entitlements macos/Runner/Release.entitlements "$app"
          else
            # Ad hoc, inside out: every program in the bundle, then the bundle.
            find "$app/Contents/Resources/tools/bin" "$app/Contents/MacOS" -type f -perm -u+x 2>/dev/null \
              | while read -r tool; do codesign --force --sign - "$tool"; done
            codesign --force --deep --sign - "$app"
          fi
          codesign --verify --deep --strict "$app"
          lipo -info "$app/Contents/MacOS/LifeOS Folio"
          mkdir -p dmg && cp -R "$app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "LifeOS Folio" -srcfolder dmg -ov -format UDZO \
            "LifeOS-Folio-$version-macOS.dmg"
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            codesign --force --timestamp --sign "$SIGN_IDENTITY" "LifeOS-Folio-$version-macOS.dmg"
          fi
          echo "DMG=LifeOS-Folio-$version-macOS.dmg" >> "$GITHUB_ENV"
      - name: Apple onayı (notarization)
        # Apple looks the package over and gives it its ticket, stapled to it
        # so that it opens on a Mac with no network as well.
        if: env.SIGN_IDENTITY != ''
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::App Store Connect anahtarı yok: imzalı paket Apple onayına gönderilemedi."
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$key"
          xcrun notarytool submit "$DMG" --key "$key" --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" --wait --timeout 3h
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"
          rm "$key"
      - name: Açılıyor mu
        # Started the way a tester starts it, left a few seconds, then closed:
        # a crash at start shows here rather than on the tester's Mac.
        run: |
          app="build/macos/Build/Products/Release/LifeOS Folio.app"
          "$app/Contents/MacOS/LifeOS Folio" > "$RUNNER_TEMP/start.log" 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/start.log"
            echo "::error::Folio açıldıktan sonra kapandı."
            exit 1
          fi
          kill "$pid"
          tail -n 40 "$RUNNER_TEMP/start.log"
      - name: Deneme sürümü olarak yayımla
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mac-deneme-${GITHUB_RUN_ID}"
          gh release create "$tag" "$DMG" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "LifeOS Folio · Mac deneme · ${GITHUB_RUN_ID}" \
            --notes "$(if [ -n "${SIGN_IDENTITY:-}" ]; then echo 'Mac için deneme paketi; Apple Developer ID ile imzalı ve Apple onaylı.'; else echo 'Mac için deneme paketi. Apple tarafından imzalı değildir: ilk açılışta Sistem Ayarları → Gizlilik ve Güvenlik'"'"'ten "Yine de Aç" seçilmelidir.'; fi)"
      - name: Sürüme ekle
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if [ -z "${SIGN_IDENTITY:-}" ]; then
            echo "::error::Sürüme yalnız Apple imzalı ve onaylı paket konur."
            exit 1
          fi
          cp "$DMG" LifeOS-Folio-macOS.dmg
          gh release upload "$TAG" LifeOS-Folio-macOS.dmg --clobber
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.publish && inputs.release_tag == '' }}
        with:
          name: LifeOS-Folio-macOS
          path: ${{ env.DMG }}
          retention-days: 7
