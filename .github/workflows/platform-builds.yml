name: Windows ve Android test paketleri
run-name: LifeOS Folio · ${{ inputs.platform }} · ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Derlenecek platform
        required: true
        default: both
        type: choice
        options: [both, windows, android]
permissions:
  contents: read
concurrency:
  group: folio-manual-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  windows:
    if: inputs.platform == 'both' || inputs.platform == 'windows'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Paketli araçları ve DLL dosyalarını doğrula
        run: python packaging/native/verify.py windows-x64 --smoke
      - run: flutter build windows --release
      - name: Windows kurulum paketini oluştur
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1
      - name: Kurulum ve kaldırmayı doğrula
        shell: pwsh
        run: ./packaging/windows/test-installer.ps1
      - name: Başarısız kurulum günlükleri
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Windows-installer-logs
          path: build/windows/installer/*.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Windows test kurulumunu Releases bölümünde yayımla
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/windows/upload-test-installer.ps1
  android:
    if: inputs.platform == 'both' || inputs.platform == 'android'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Release imza anahtarını yerleştir
        # Written to the runner's temporary folder, which is thrown away with
        # the runner; never into the repository. Without the secret the APKs
        # are signed with the debug key, as a fork's would be.
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "Release anahtarı yok; APK'lar debug anahtarıyla imzalanacak."
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/folio-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/folio-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Test APK paketleri
        run: flutter build apk --release --split-per-abi
      - name: Paketleri adlandır
        run: |
          mkdir -p artifacts
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$apk" | sed 's/^app-//; s/-release.apk$//')"
            cp "$apk" "artifacts/LifeOS-Folio-Android-${abi}.apk"
          done
      - name: Android test APK paketlerini Releases bölümünde yayımla
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/android/upload-test-apks.sh
