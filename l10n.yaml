# LifeOS Ofis's languages (Folio stays Turkish): the Turkish file is the
# template, each other language's file its translation. `flutter gen-l10n`
# (run by `flutter pub get` / build) writes lib/l10n/gen/.
arb-dir: lib/l10n
template-arb-file: app_tr.arb
output-dir: lib/l10n/gen
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
synthetic-package: false
